name: test

on:
  push:
    branches: [main, "build/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm install --prefix workers/telegram-research
      - run: npm test --prefix workers/telegram-research
